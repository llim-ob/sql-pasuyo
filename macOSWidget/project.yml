name: SQLPasuyo
options:
  bundleIdPrefix: com.objectbright
  deploymentTarget:
    macOS: "14.0"
targets:
  SQLPasuyo:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - target: SQLPasuyoWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.objectbright.sqlpasuyo
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: App-Info.plist
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_CFBundleDisplayName: SQL Pasuyo
      INFOPLIST_KEY_LSUIElement: YES
      CODE_SIGN_IDENTITY: "-"
      SWIFT_VERSION: 5.0
  SQLPasuyoWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.objectbright.sqlpasuyo.widget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Widget-Info.plist
      CODE_SIGN_IDENTITY: "-"
      SWIFT_VERSION: 5.0
